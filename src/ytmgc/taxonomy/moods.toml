# Correspondance style Discogs -> ambiance.
#
# Discogs ne décrit aucune humeur : cette table est un jugement éditorial,
# assumé comme tel. Elle est faite pour être corrigée — modifier une ligne se
# rejoue avec `plan` et `apply`, sans un seul appel réseau.
#
# Chaque style relève d'exactement une ambiance. Un titre portant plusieurs
# styles peut donc relever de plusieurs ambiances, comme pour les genres.

[moods]
"Calme" = "Musiques posées, à faible intensité : on les met pour que l'air de la pièce change, pas pour qu'il s'agite."
"Mélancolique" = "Le registre de la peine et du souvenir : tempos lents, harmonies mineures, voix qui portent le poids du texte."
"Énergique" = "Tout ce qui pousse en avant : tempo élevé, attaque franche, intensité tenue du début à la fin."
"Festif" = "Musiques de fête et de danse collective, écrites pour un groupe de gens debout."
"Planant" = "La répétition et la texture priment sur la mélodie : la musique installe un espace et s'y étend."
"Sombre" = "Registre dur ou inquiétant : saturation, dissonance, imaginaire nocturne ou violent."
"Groovy" = "Le balancement d'abord : basse et batterie enlacées, tempo moyen, tout l'intérêt dans la façon dont ça tombe."
"Cérébral" = "Musiques d'écoute attentive, à la construction complexe, qui se laissent difficilement mettre en fond sonore."

