# Descriptions des genres et styles Discogs, inscrites dans la description de
# chaque playlist. L'objectif du projet n'est pas seulement de ranger, mais de
# comprendre ce qu'on écoute : chaque playlist explique donc ce qu'elle contient.
#
# Les clés `genres` reprennent les libellés bruts de Discogs. Les clés `styles`
# reprennent les libellés *après* application de la table d'alias.
# Un style absent de cette table reste utilisable : la playlist est simplement
# décrite sans définition.

[genres]
"Blues" = "Né dans le Sud des États-Unis à la fin du XIXe siècle dans les communautés afro-américaines, structuré autour de la grille de douze mesures et des blue notes. Matrice de presque toute la musique populaire du XXe siècle."
"Brass & Military" = "Musique pour ensembles de cuivres : fanfares, harmonies municipales, musiques militaires et brass bands."
"Children's" = "Musique écrite pour le jeune public : comptines, chansons éducatives, contes musicaux."
"Classical" = "Musique savante occidentale, du répertoire médiéval à la création contemporaine, transmise principalement par la partition."
"Electronic" = "Musiques dont le son est produit ou transformé par des moyens électroniques — synthétiseurs, boîtes à rythmes, échantillonneurs, ordinateurs. Recouvre aussi bien la musique de club que l'écoute domestique et l'expérimentation."
"Folk, World, & Country" = "Traditions populaires et régionales du monde entier, musiques country nord-américaines et leurs prolongements contemporains."
"Funk / Soul" = "Musiques afro-américaines nées dans les années 1960 : la soul, héritière du gospel et du rhythm and blues, et le funk, qui déplace l'accent sur le groove et la section rythmique."
"Hip Hop" = "Né dans le Bronx au milieu des années 1970 autour du DJing, du rap, du graffiti et de la danse. Musicalement fondé sur l'échantillonnage, la boucle et le flow."
"Jazz" = "Né à La Nouvelle-Orléans au début du XXe siècle, fondé sur l'improvisation, le swing et un dialogue permanent entre écriture et liberté individuelle."
"Latin" = "Musiques d'Amérique latine et de la Caraïbe, portées par les héritages croisés africains, européens et amérindiens."
"Non-Music" = "Enregistrements non musicaux : parole, terrain, bruitages, archives sonores."
"Pop" = "Musique populaire de grande diffusion, construite autour de la chanson, du refrain et de la production de studio."
"Reggae" = "Né en Jamaïque à la fin des années 1960 dans le sillage du ska et du rocksteady, reconnaissable au contretemps de la guitare et au rôle central de la basse."
"Rock" = "Issu du rock'n'roll des années 1950, bâti sur le trio guitare-basse-batterie, et devenu le tronc d'une famille de styles extrêmement ramifiée."
"Stage & Screen" = "Musique écrite pour l'image et la scène : bandes originales, partitions de film, comédies musicales, musique de jeu vidéo."

[styles]

# ---------------------------------------------------------------- Electronic
"House" = "Née à Chicago au début des années 1980, autour d'une grosse caisse à quatre temps, entre 118 et 130 BPM, héritière directe du disco."
"Deep House" = "Branche la plus soul de la house : tempo modéré, accords de septième et de neuvième empruntés au jazz, nappes profondes et voix feutrées."
"Deep Techno" = "Techno feutrée et immersive, aux nappes profondes et à la percussion en retrait."
"Euro House" = "House continentale des années 1990, aux mélodies immédiates et à la production très produite."
"Hard House" = "House rapide et percussive, aux kicks appuyés."
"Tech House" = "Hybride de house et de techno : le groove et le swing de la première, la sécheresse et le minimalisme de la seconde."
"Progressive House" = "House aux morceaux longs et à la montée progressive, structurée par des changements de texture plutôt que par un refrain."
"Acid House" = "Définie par la ligne de basse résonnante de la Roland TB-303, dont le filtre modulé produit un son acide caractéristique. Chicago, milieu des années 1980."
"Garage House" = "Née au Paradise Garage à New York, plus vocale et plus gospel que la house de Chicago."
"UK Garage" = "Née à Londres au milieu des années 1990 : rythmiques syncopées ou en 2-step, basses lourdes et voix accélérées."
"Techno" = "Née à Detroit au milieu des années 1980, machinique et répétitive, généralement entre 125 et 150 BPM, tournée vers la texture plutôt que vers la mélodie."
"Detroit Techno" = "La techno d'origine, façonnée à Detroit par la génération de Juan Atkins, Derrick May et Kevin Saunderson : futuriste, mélodique, marquée par la soul."
"Minimal" = "Réduction à l'essentiel : peu d'éléments, des variations infimes, une attention portée au détail et à la durée."
"Dub Techno" = "Techno passée au filtre du dub jamaïcain : accords noyés de réverbération, échos profonds, mouvement très lent. Berlin, début des années 1990."
"Minimal Techno" = "Techno réduite à ses éléments essentiels, où l'intérêt naît de variations minuscules étalées dans la durée."
"Trance" = "Montées, nappes arpégées et ruptures spectaculaires, autour de 135 BPM, pensée pour les grands espaces."
"Psy-Trance" = "Trance psychédélique née à Goa : basses roulantes, séquences acides et textures kaléidoscopiques, à tempo élevé."
"Ambient" = "Musique d'atmosphère, sans pulsation marquée, conçue pour créer un espace plutôt que pour être suivie note à note. Formalisée par Brian Eno à la fin des années 1970."
"Dark Ambient" = "Ambient de tonalité sombre : drones graves, textures industrielles, atmosphères oppressantes."
"Drone" = "Bâtie sur des sons tenus et des harmoniques lentement mouvantes, où le temps musical se dilate."
"New Age" = "Musique apaisante et méditative, souvent instrumentale, née dans les années 1970 en marge du courant ambient."
"IDM" = "« Intelligent Dance Music » : électronique de tête née au Royaume-Uni au début des années 1990, aux rythmiques complexes et à la mélodie soignée, faite pour l'écoute plutôt que pour le club."
"Glitch" = "Fait musique de l'erreur numérique : craquements, décrochages, artefacts de compression érigés en matériau."
"Experimental" = "Recherche sonore refusant les formes établies, souvent à la lisière de la musique concrète et de l'art sonore."
"Leftfield" = "Électronique inclassable, qui emprunte à plusieurs styles sans se ranger dans aucun."
"Abstract" = "Électronique sans forme de chanson ni pulsation de danse, organisée par la texture et le collage."
"Downtempo" = "Électronique à tempo lent, atmosphérique et souvent instrumentale, pensée pour l'écoute."
"Trip Hop" = "Née à Bristol au début des années 1990 : breakbeats ralentis, échantillons de cordes et de jazz, atmosphère nocturne et mélancolique."
"Breakbeat" = "Construite sur des breaks de batterie funk échantillonnés, à la rythmique syncopée plutôt qu'à quatre temps."
"Big Beat" = "Breakbeats lourds, riffs saturés et gros refrains ; le versant festif et rock de l'électronique des années 1990."
"Drum & Bass" = "Née au Royaume-Uni au milieu des années 1990 : breaks accélérés autour de 170 BPM sur des lignes de basse sub très graves."
"Jungle" = "Ancêtre direct du drum & bass, plus proche du sound system : breakbeats hachés, basses ragga et échantillons vocaux jamaïcains. Londres, 1992-1995."
"Dubstep" = "Née à Londres au début des années 2000 : tempo à 140 BPM, caisse claire décalée au troisième temps, basses sub massives et grands espaces silencieux."
"Grime" = "Née à Londres au début des années 2000 : rythmiques à 140 BPM anguleuses et synthétiques, sur lesquelles le MC est central."
"Footwork" = "Née à Chicago : 160 BPM, échantillons hachés et rythmiques trébuchantes, conçue pour la danse compétitive."
"Electro" = "Héritée de Kraftwerk et d'Afrika Bambaataa : rythmique syncopée de boîte à rythmes TR-808, timbres robotiques, esthétique futuriste."
"Electro House" = "House énergique aux basses saturées et aux synthétiseurs agressifs, dominante à la fin des années 2000."
"Synth-Pop" = "Pop dont le synthétiseur est l'instrument principal, née au tournant des années 1980 : mélodies claires, production froide et brillante."
"Synthwave" = "Reconstitution contemporaine des sonorités synthétiques des années 1980, souvent nourrie d'imaginaire cinématographique."
"Vaporwave" = "Collage des années 2010 fait d'échantillons ralentis de pop et de musique d'ambiance commerciale, sur un ton nostalgique et ironique."
"EBM" = "Electronic Body Music : rythmiques martelées, basses séquencées et voix scandées, à la frontière de l'industriel et de la piste de danse."
"Industrial" = "Née à la fin des années 1970 : bruit, percussions métalliques et textures mécaniques, souvent à charge critique."
"Italo-Disco" = "Disco électronique produite en Italie au début des années 1980 : synthétiseurs brillants, voix traitées, mélodies immédiates."
"Nu-Disco" = "Relecture contemporaine du disco et de la boogie, entre instruments joués et production électronique."
"Hardcore" = "Électronique très rapide et saturée, née au début des années 1990, aux kicks distordus."
"Gabber" = "Hardcore néerlandais extrême : grosse caisse distordue et tempo au-delà de 160 BPM."
"Acid" = "Tout ce qui repose sur le filtre résonnant de la TB-303, quel que soit le tempo."
"Berlin-School" = "Électronique allemande des années 1970 fondée sur de longues séquences de synthétiseur en évolution lente."
"Broken Beat" = "Rythmiques délibérément déboîtées mêlant house, jazz et funk ; scène londonienne du tournant des années 2000."
"Future Jazz" = "Rencontre de l'électronique et de l'harmonie jazz, entre programmation et improvisation."
"Lounge" = "Musique d'ambiance élégante et détendue, héritée de l'easy listening des années 1960."
"Chiptune" = "Composée avec les puces sonores des consoles et micro-ordinateurs 8 bits, ou dans leur esthétique."

# ---------------------------------------------------------------------- Rock
"Alternative Rock" = "Rock issu des circuits indépendants des années 1980, fédérant les courants qui refusent les codes du rock grand public."
"Indie Rock" = "Rock produit hors des grandes maisons de disques, à l'esthétique volontairement moins lissée."
"Indie Pop" = "Pop de production légère et de mélodie douce, née dans la mouvance indépendante britannique des années 1980."
"Post-Punk" = "Prolongement du punk à partir de 1978 : basse mise en avant, guitares anguleuses, froideur assumée et ouverture au dub comme à l'électronique."
"Punk" = "Rock rapide, bref et frontal, né au milieu des années 1970 sur un principe d'urgence et de refus du virtuose."
"Post-Hardcore" = "Issu du hardcore punk, il en garde l'intensité en élargissant la palette dynamique et harmonique."
"Post-Rock" = "Utilise l'instrumentation du rock à des fins non rock : longues progressions instrumentales, textures et crescendos plutôt que couplets et refrains."
"Progressive Rock" = "Rock ambitieux des années 1970 : morceaux longs, métriques irrégulières, emprunts au classique et au jazz."
"Psychedelic Rock" = "Rock des années 1960 cherchant à traduire l'expérience psychédélique : effets de studio, modalité orientale, formes étirées."
"Space Rock" = "Rock planant fondé sur la répétition, les nappes et l'espace, aux confins du psychédélisme."
"Garage Rock" = "Rock brut et direct des années 1960, joué par des groupes amateurs, à la production rudimentaire."
"Grunge" = "Né à Seattle à la fin des années 1980 : guitares épaisses héritées du hard rock, écriture pop et chant écorché."
"Shoegaze" = "Murs de guitares saturées et noyées d'effets, voix fondue dans la masse sonore. Royaume-Uni, fin des années 1980."
"Dream Pop" = "Pop de textures floues et de voix aériennes, cousine du shoegaze mais plus mélodique."
"Noise" = "Fait du bruit et de la saturation le matériau principal plutôt qu'un accident."
"Krautrock" = "Rock expérimental allemand de la fin des années 1960 et des années 1970, fondé sur la répétition, la pulsation motorik et l'électronique."
"Hard Rock" = "Rock à guitares saturées et riffs puissants, né à la fin des années 1960."
"Heavy Metal" = "Riffs de guitare massifs, tempo appuyé et virtuosité instrumentale, à partir du début des années 1970."
"Death Metal" = "Metal extrême : chant guttural, tempos rapides, riffs dissonants et batterie en blast beat."
"Black Metal" = "Metal extrême aux guitares acérées, au chant écorché et à la production volontairement rêche."
"Doom Metal" = "Metal lent et écrasant, aux riffs étirés et à l'atmosphère funèbre."
"Sludge Metal" = "Croisement du doom et du hardcore : lenteur, saturation épaisse et chant hurlé."
"Stoner Rock" = "Riffs lourds et groovy accordés bas, hérités du hard rock des années 1970."
"Grindcore" = "Extrêmement rapide et bref, à la croisée du hardcore punk et du death metal."
"Math Rock" = "Rock aux métriques complexes et aux structures déboîtées, d'écriture très précise."
"Emo" = "Issu du hardcore, il en garde l'énergie en assumant une écriture ouvertement introspective."
"Screamo" = "Branche du hardcore émotionnel, aux dynamiques extrêmes et au chant hurlé."
"New Wave" = "Contemporaine du post-punk mais tournée vers la pop : synthétiseurs, refrains efficaces, production nette."
"No Wave" = "Réaction new-yorkaise radicale à la new wave, abrasive et atonale."
"Goth Rock" = "Rock sombre né du post-punk : basse mélodique, guitares réverbérées, imaginaire romantique noir."
"Art Rock" = "Rock d'ambition formelle, nourri d'avant-garde et d'arts visuels."
"Pop Rock" = "Rock de format chanson, mélodique et accessible."
"Power Pop" = "Chansons rock brèves et mélodiques, héritées des groupes des années 1960."
"Folk Rock" = "Répertoire et écriture folk portés par l'instrumentation électrique du rock."
"Blues Rock" = "Rock directement adossé au vocabulaire du blues électrique."
"Rock'n'Roll" = "Forme fondatrice des années 1950, issue du rhythm and blues et de la country."
"Rockabilly" = "Rock'n'roll des origines mâtiné de country : contrebasse claquée, écho slapback, énergie sèche."
"Surf" = "Rock instrumental californien du début des années 1960, à la guitare réverbérée et au trémolo."

# ------------------------------------------------------------------- Hip Hop
"Boom Bap" = "Hip hop new-yorkais des années 1990 : batteries échantillonnées lourdes, boucles de jazz ou de soul, tempo posé."
"Conscious" = "Hip hop dont le propos social et politique est au centre du texte."
"Gangsta" = "Hip hop né sur la côte Ouest à la fin des années 1980, à l'écriture narrative et documentaire de la rue."
"G-Funk" = "Branche californienne du gangsta rap : synthétiseurs sifflants, basses rondes et tempo alangui, hérités du P-Funk."
"Jazzy Hip-Hop" = "Hip hop bâti sur des échantillons de jazz, aux harmonies chaudes et au groove souple."
"Instrumental" = "Productions hip hop sans rap, où le beat se suffit à lui-même."
"Turntablism" = "Le platine comme instrument : scratch, coupes et manipulations en temps réel."
"Trap" = "Née dans le Sud des États-Unis : charleys en triolets rapides, 808 saturées et tempo lent en apparence."
"Cloud Rap" = "Trap aux productions aériennes et réverbérées, au flow détaché."
"Drill" = "Rap sombre et frontal né à Chicago, aux basses glissées et aux rythmiques sèches."
"Crunk" = "Rap du Sud pensé pour le club : chants scandés, synthétiseurs criards, énergie collective."
"Horrorcore" = "Rap à l'imaginaire d'horreur, aux productions volontairement inquiétantes."
"Britcore" = "Hip hop britannique rapide et dense de la fin des années 1980."

# ---------------------------------------------------------------------- Jazz
"Bebop" = "Révolution des années 1940 : tempos rapides, harmonie complexe et improvisation virtuose, sortie du cadre dansant du swing."
"Hard Bop" = "Prolongement du bebop au milieu des années 1950, réinjectant blues, gospel et groove."
"Post Bop" = "Jazz d'après le hard bop, qui en garde le cadre en assouplissant l'harmonie et la forme."
"Modal" = "Improvisation fondée sur des modes plutôt que sur une grille d'accords, ouvrant de larges espaces mélodiques. Formalisée à la fin des années 1950."
"Cool Jazz" = "Réaction au bebop : tempos retenus, sonorités douces, arrangements écrits."
"Free Jazz" = "Abandonne grille, tempo fixe et parfois tonalité au profit d'une improvisation collective libre. À partir de 1960."
"Free Improvisation" = "Improvisation sans thème ni cadre préétabli, souvent hors du langage jazz lui-même."
"Spiritual Jazz" = "Jazz modal à visée méditative et spirituelle, marqué par les modalités non occidentales."
"Swing" = "Jazz d'orchestre des années 1930, dansant et arrangé, bâti sur la pulsation balancée."
"Big Band" = "Grande formation à sections de cuivres, d'anches et de rythmique, au répertoire écrit."
"Jazz-Funk" = "Jazz adossé au groove du funk, avec claviers électriques et basse en avant."
"Fusion" = "Rencontre du jazz et du rock à partir de la fin des années 1960 : amplification, virtuosité, énergie électrique."
"Soul-Jazz" = "Jazz nourri de gospel et de rhythm and blues, souvent porté par l'orgue Hammond."
"Latin Jazz" = "Jazz sur rythmiques afro-cubaines et brésiliennes."
"Contemporary Jazz" = "Jazz de création actuelle, largement ouvert aux autres musiques."
"Smooth Jazz" = "Jazz de production lisse et mélodique, conçu pour une écoute d'ambiance."
"Dixieland" = "Jazz des origines, à l'improvisation collective polyphonique."

# --------------------------------------------------------------- Funk & Soul
"Funk" = "Groove fondé sur le premier temps et sur l'entrelacement des parties rythmiques, où l'harmonie s'efface derrière la pulsation. Fin des années 1960."
"Soul" = "Ferveur du gospel appliquée au répertoire profane : voix expressive, sections de cuivres, écriture de chanson."
"Disco" = "Musique de club des années 1970 : quatre temps, cordes, cuivres et basse mélodique, pensée pour un enchaînement continu."
"Boogie" = "Post-disco du début des années 1980, où le synthétiseur remplace peu à peu l'orchestre."
"P.Funk" = "Funk psychédélique de la galaxie Parliament-Funkadelic : formations pléthoriques, science-fiction et grooves élastiques."
"Psychedelic Soul" = "Soul passée par les effets de studio et l'imaginaire psychédélique de la fin des années 1960."
"Northern Soul" = "Scène britannique des années 1970 dévouée à la soul américaine rapide et rare des années 1960."
"Modern Soul" = "Soul des années 1970 et 1980 à la production plus lisse et aux arrangements sophistiqués."
"Neo Soul" = "Renouveau de la soul dans les années 1990 : instrumentation organique, harmonie jazz, groove hip hop."
"Rhythm & Blues" = "Rhythm and blues d'après-guerre : blues électrifié et rythmé, joué en petite formation avec cuivres, matrice directe du rock'n'roll et de la soul."
"Contemporary R&B" = "R&B contemporain, à partir des années 1990 : production électronique lisse, chant très orné et influence marquée du hip hop."
"Gospel" = "Musique religieuse afro-américaine, matrice vocale de la soul."
"Afrobeat" = "Créé au Nigeria par Fela Kuti : longues pièces où le highlife, le jazz et le funk se fondent sur des rythmiques yoruba."

# ------------------------------------------------------------------- Reggae
"Roots Reggae" = "Reggae de la décennie 1970 à propos spirituel et politique, marqué par le rastafarisme."
"Dub" = "Face B devenue genre : la voix disparaît, la table de mixage devient instrument, l'écho et la réverbération structurent le morceau."
"Dancehall" = "Reggae de sound system des années 1980, plus rapide et souvent numérique, centré sur le DJ."
"Ragga" = "Dancehall entièrement électronique, aux rythmiques programmées."
"Ska" = "Ancêtre du reggae, né en Jamaïque au début des années 1960 : tempo rapide, contretemps de guitare, cuivres."
"Rocksteady" = "Chaînon entre ska et reggae, vers 1966-1968 : tempo ralenti, basse mise en avant, chant en harmonies."
"Lovers Rock" = "Reggae romantique développé au Royaume-Uni, à la production douce."
"Dub Poetry" = "Poésie dite sur rythmiques reggae, à forte charge politique."

# ---------------------------------------------------------------------- Pop
"Ballad" = "Chanson lente à dominante mélodique et émotionnelle."
"Chanson" = "Tradition francophone où le texte prime, servi par un accompagnement au service du mot."
"Europop" = "Pop continentale de production soignée et de refrain immédiat."
"City Pop" = "Pop japonaise urbaine de la fin des années 1970 et des années 1980, nourrie de soul, de funk et de fusion."
"J-pop" = "Pop japonaise contemporaine, à la production dense et aux mélodies très travaillées."
"K-pop" = "Pop coréenne contemporaine, associant production internationale et mise en scène chorégraphique."
"Vocal" = "Interprétation chantée mise au premier plan, souvent avec accompagnement orchestral."
"Bubblegum" = "Pop délibérément simple et enjouée, à destination du grand public adolescent."
"Schlager" = "Chanson populaire germanophone, sentimentale et facile à retenir."

# ----------------------------------------------------------------- Classical
"Baroque" = "Répertoire d'environ 1600 à 1750 : basse continue, contrepoint, ornementation abondante."
"Romantic" = "Répertoire du XIXe siècle : expressivité, chromatisme et grandes formes orchestrales."
"Opera" = "Théâtre chanté, associant voix soliste, chœur et orchestre."
"Choral" = "Répertoire pour chœur, sacré ou profane."
"Impressionist" = "Tournant du XXe siècle en France : couleur harmonique, modalité et suggestion plutôt que récit."
"Modern Classical" = "Répertoire savant du XXe siècle, après la rupture avec la tonalité commune."
"Contemporary" = "Création savante actuelle, aux langages et aux dispositifs très divers."
"Neo-Classical" = "Écriture savante contemporaine restée tonale, souvent pour piano ou petit ensemble."
"Minimalism" = "Motifs brefs répétés et lentement déphasés, développés aux États-Unis à partir des années 1960."
"Medieval" = "Répertoire antérieur à 1400 : monodie grégorienne et premières polyphonies."
"Renaissance" = "Répertoire des XVe et XVIe siècles, à la polyphonie vocale équilibrée."

# --------------------------------------------------------------------- Latin
"Bossa Nova" = "Née au Brésil à la fin des années 1950 : samba ralentie, harmonie de jazz, chant murmuré et guitare syncopée."
"Samba" = "Rythme brésilien d'origine afro-bahianaise, pilier du carnaval de Rio."
"MPB" = "Música Popular Brasileira : chanson brésilienne savante née dans les années 1960, ouverte au jazz et au rock."
"Salsa" = "Synthèse new-yorkaise des musiques cubaines et portoricaines, portée par la clave et les cuivres."
"Son" = "Matrice cubaine de la salsa, née dans l'Oriente, entre guitare, percussions et chant alterné."
"Afro-Cuban" = "Musiques cubaines d'héritage africain, aux polyrythmies de percussions."
"Mambo" = "Danse cubaine des années 1940 et 1950, à l'orchestration cuivrée et enlevée."
"Bolero" = "Chanson d'amour lente d'origine cubaine, à l'écriture mélodique très ornée."
"Cumbia" = "Rythme colombien devenu populaire dans toute l'Amérique latine."
"Tango" = "Né dans le Río de la Plata, marqué par le bandonéon et une écriture dramatique."
"Merengue" = "Danse dominicaine rapide, à la pulsation binaire soutenue."
"Reggaeton" = "Né à Porto Rico dans les années 1990 sur le rythme dembow, entre dancehall et rap hispanophone."
"Ranchera" = "Chanson mexicaine traditionnelle, souvent portée par le mariachi."

# ------------------------------------------------------------ Folk & Country
"Folk" = "Chanson de tradition populaire ou d'écriture contemporaine s'y rattachant, à l'instrumentation acoustique."
"Country" = "Musique populaire du Sud des États-Unis, née de la rencontre des traditions britanniques et du blues."
"Bluegrass" = "Country virtuose et acoustique, à l'instrumentation banjo-mandoline-violon et au chant haut."
"Honky Tonk" = "Country des bars du Texas et de l'Oklahoma, à la pedal steel et au propos désabusé."
"Celtic" = "Traditions musicales d'Irlande, d'Écosse, de Bretagne et de Galice."
"Flamenco" = "Art andalou associant chant, guitare et danse, structuré par les palos."
"Fado" = "Chant portugais mélancolique, accompagné à la guitare portugaise."
"Klezmer" = "Musique instrumentale festive des communautés juives d'Europe de l'Est."
"Highlife" = "Musique de danse ghanéenne mêlant guitares, cuivres et rythmes locaux."
"Cajun" = "Musique francophone de Louisiane, à l'accordéon et au violon."
"Raga" = "Musique classique indienne organisée autour des ragas, cadres mélodiques et modaux."
"Traditional" = "Répertoire transmis oralement, sans auteur identifié."

# ---------------------------------------------------------------------- Blues
"Delta Blues" = "Blues rural du delta du Mississippi : voix et guitare slide, forme libre et intense."
"Country Blues" = "Blues acoustique d'avant-guerre, joué en solo à la guitare."
"Chicago Blues" = "Blues électrifié par la Grande Migration : groupe complet, harmonica amplifié, son urbain."
"Electric Blues" = "Blues joué à la guitare amplifiée, au son épais et soutenu."
"Texas Blues" = "Blues à la guitare volubile et au phrasé proche du jazz."
"Jump Blues" = "Blues rapide et cuivré des années 1940, à mi-chemin du swing et du rhythm and blues."
"Piedmont Blues" = "Blues de la côte Est, au jeu de guitare en fingerpicking syncopé."
"Harmonica Blues" = "Blues où l'harmonica tient le rôle principal."

# ------------------------------------------------------------- Stage & Screen
"Soundtrack" = "Musique accompagnant un film, une série ou un jeu."
"Score" = "Partition originale composée pour l'image."
"Musical" = "Musique de comédie musicale, où les numéros chantés portent le récit."
"Theme" = "Thème principal d'une œuvre audiovisuelle."
"Video Game Music" = "Musique composée pour le jeu vidéo, souvent conçue pour la boucle et l'interaction."
