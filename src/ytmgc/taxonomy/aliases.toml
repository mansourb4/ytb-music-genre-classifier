# Table de normalisation de la taxonomie Discogs.
#
# Discogs expose deux niveaux : `genre` (15 valeurs) et `style` (~500 valeurs).
# Ce fichier ne fait que nettoyer ces valeurs ; il ne les invente pas.

# Libellé affiché dans le nom de playlist. Les genres Discogs contenant "/"
# ou "," produisent des noms de playlist illisibles.
[genre_display]
"Funk / Soul" = "Funk & Soul"
"Folk, World, & Country" = "Folk & World"
"Stage & Screen" = "BO & Scène"
"Brass & Military" = "Fanfare"
"Children's" = "Jeunesse"
"Non-Music" = "Hors-musique"

# Ordre de préférence quand une release porte plusieurs genres. Le premier
# genre présent dans cette liste devient le genre principal du titre.
# Les genres les plus spécifiques passent avant les plus génériques : une
# release "Electronic, Pop" décrit mieux la playlist sous "Electronic".
[genre_priority]
order = [
    "Hip Hop",
    "Electronic",
    "Jazz",
    "Reggae",
    "Funk / Soul",
    "Blues",
    "Latin",
    "Classical",
    "Folk, World, & Country",
    "Stage & Screen",
    "Brass & Military",
    "Rock",
    "Pop",
    "Children's",
    "Non-Music",
]

# Alias de styles. Volontairement limités aux **variantes d'écriture** d'un même
# style : fusionner deux styles réellement distincts (Jungle dans Drum & Bass,
# Indie Rock dans Indie) détruirait l'information que le projet cherche à
# restituer. Clé = libellé Discogs, valeur = libellé retenu.
[style_aliases]
"Drum n Bass" = "Drum & Bass"
"Hip-Hop" = "Hip Hop"
"Synth-pop" = "Synth-Pop"
"Rock & Roll" = "Rock'n'Roll"
"Prog Rock" = "Progressive Rock"
"RnB/Swing" = "Contemporary R&B"
# Discogs emploie "Modern" presque exclusivement dans le genre Classical.
"Modern" = "Modern Classical"

# Styles qui ne décrivent pas la musique mais l'objet ou l'édition : ils ne
# doivent jamais donner de playlist.
[style_blocklist]
styles = ["Reissue", "Compilation", "Album", "Single", "Promo", "Unofficial Release"]
