[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmgc"
version = "0.1.0"
description = "Organise une bibliothèque YouTube Music en playlists par genre et style, à partir des métadonnées Discogs"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.7",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
# Connexion sans copier-coller : reprise de la session du navigateur installé,
# et fenêtre de connexion pilotée.
browser = ["browser-cookie3>=0.19", "playwright>=1.40"]
dev = [
    "pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.27",
    "browser-cookie3>=0.19",
]

[project.scripts]
ytmgc = "ytmgc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytmgc = ["taxonomy/*.toml", "web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
