[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmgc"
version = "0.1.0"
description = "Organise une bibliothèque YouTube Music en playlists par genre et style, à partir des métadonnées Discogs"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ytmgc = "ytmgc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ytmgc = ["taxonomy/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
