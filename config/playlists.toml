# ================================================================== électro

# La house est rangée par style, pas par présence de voix : chaque style a sa
# propre ambiance. Pour un titre, la première question qui répond oui :
#   set ou mix d'une heure et plus → DJ sets & mixes ; percussions tribales,
#   chant africain ou oriental → Afro house ; synthés et mélodie en avant,
#   longues montées → Melodic house ; kick sec, basse roulante, club minimal →
#   Tech house ; une vraie voix soul ou gospel au centre → Soulful house ;
#   sample disco filtré → House filtrée ; tube, refrain, piano 90s, latino →
#   House festive ; lent, organique, coucher de soleil → House lente &
#   organique ; sinon deep house : house de Detroit brute et samplée
#   (Moodymann, Theo Parrish) → Detroit house & beatdown, pionniers au son
#   rond et hypnotique → Deep house classique, production moderne jazzy ou
#   lo-fi → Deep house jazzy & lo-fi.
# Les blocs vont du plus étroit au plus large, avant la techno, dont les
# règles acceptent aussi la tech house et la progressive.

[[playlist]]
nom = "Électro · DJ sets & mixes"
description = "Sets et mixes d'une heure et plus : à écouter d'une traite, à part des playlists de morceaux."
manuelle = true

[[playlist]]
nom = "Électro · House lente & organique"
description = "House lente et organique, de 100 à 115 BPM : kick doux, percussions boisées, voix chuchotées, ambiance coucher de soleil."
