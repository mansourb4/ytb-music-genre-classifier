# Plan de playlists — tri « Par famille ».
#
# Deux principes :
#   1. comprendre ce qu'on écoute : chaque playlist porte une famille réelle
#      (« Brésil · Bossa nova », « Jazz · Ethio-jazz »), jamais un fourre-tout ;
#   2. garder la même ambiance du premier au dernier titre : une famille qui
#      mêle des ambiances est découpée — le plus souvent en une playlist vive
#      (groovy, festive, énergique) et une douce (calme, planante,
#      mélancolique).
#
# Chaque morceau va dans la PREMIÈRE playlist dont une règle lui correspond,
# en lisant ce fichier de haut en bas. D'où l'ordre :
#   1. d'abord les playlists transversales (Brésil, Maghreb, R&B…), qui
#      réunissent un style ou des artistes quel que soit le genre que Claude a
#      donné ;
#   2. puis chaque famille, de la règle la plus étroite à la plus large.
# Pour découper par ambiance, on écrit d'abord le bloc qui nomme les
# ambiances, puis le même bloc sans ambiance, qui prend tout le reste — y
# compris un titre dont l'ambiance est inconnue.
#
# Une règle combine jusqu'à quatre critères ; un critère absent accepte tout :
#   genres    = genres du verdict (liste fermée : Electronic, Hip Hop, Jazz,
#               Funk & Soul, Classical, Pop, Latin, Rock, Folk & World,
#               Blues, Reggae, Hors-musique, Jeunesse…)
#   styles    = styles du verdict (texte libre, tel qu'écrit dans verdicts.txt)
#   ambiances = Calme, Énergique, Festif, Groovy, Mélancolique, Planant,
#               Sombre, Cérébral
#   artistes  = noms d'artistes (invités compris, casse et accents libres).
#               Le verdict ne dit pas d'où vient une musique : c'est ainsi
#               qu'on range par région.
# Plusieurs blocs portant le même nom alimentent la même playlist.
#
# Un morceau qu'aucune règle n'accepte n'est versé nulle part : l'aperçu le
# liste avec son genre, son style et son ambiance, pour qu'on ajoute la règle.
#
# Renommer une playlist ici en crée une nouvelle à l'application : l'ancienne
# est vidée. Changer une règle, en revanche, se voit tout de suite à l'aperçu.

# Taille visée : l'aperçu signale les playlists hors de cette plage. Le
# minimum est bas à dessein : une petite playlist qui garde la même ambiance
# vaut mieux qu'une grande qui saute du flamenco au chant russe.
[taille]
min = 5
max = 150


