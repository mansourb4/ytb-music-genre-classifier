# Copie ce fichier en config/config.toml et adapte-le.

[store]
# Base SQLite : cache Discogs, bibliothèque scannée, classifications.
path = "data/ytmgc.db"

[youtube]
# Fichier d'auth ytmusicapi (browser.json ou oauth.json).
auth_file = "browser.json"
# Identifiant client OAuth, pour la connexion depuis un appareil sans outils de
# développement (téléphone). Écrit par l'interface ; peut aussi venir de
# YTMGC_OAUTH_CLIENT_ID / YTMGC_OAUTH_CLIENT_SECRET.
oauth_client_file = "oauth_client.json"
# Sources à scanner : "library" (titres ajoutés), "liked", "uploads",
# ou "playlist:<playlistId>" pour cibler une playlist précise.
sources = ["library", "liked"]
# Visibilité des playlists créées : PRIVATE | UNLISTED | PUBLIC
playlist_privacy = "PRIVATE"

[discogs]
user_agent = "ytb-music-genre-classifier/0.1"
# Requêtes/minute. L'API authentifiée autorise 60/min ; on garde une marge.
rate_limit_per_minute = 50
# Durée de validité du cache de recherche, en jours.
cache_ttl_days = 90

[lastfm]
# Tags posés par les auditeurs sur chaque titre. Seule source décrivant le
# morceau et non le disque : c'est elle qui distingue une ballade d'un brûlot
# sur un même album. Sans clé (LASTFM_API_KEY), l'analyse s'en passe et
# retombe sur les seuls styles de la release.
enabled = true
rate_limit_per_minute = 180
cache_ttl_days = 180
# Poids minimal d'un tag (0-100) pour qu'il désigne un style.
min_tag_weight = 20
# Poids cumulé minimal pour retenir une ambiance. Bas à dessein : les tags
# d'humeur sont toujours faiblement pondérés face aux tags de genre.
min_mood_weight = 3
# Nombre de tags de style retenus pour affiner un titre.
max_styles_per_track = 2

[claude]
# Jugement du morceau par un modèle. C'est la seule source qui connaisse la
# *musique* et non ses étiquettes : Discogs décrit le disque, Last.fm compile
# des tags posés par des auditeurs, et ni l'un ni l'autre ne sait qu'un morceau
# donné est une berceuse au milieu d'un album de rage.
#
# C'est aussi la seule qui se paie. Sans clé (ANTHROPIC_API_KEY), tout le reste
# fonctionne à l'identique. Chaque titre n'est jugé qu'une fois, et son verdict
# est écrit dans un fichier texte qui survit à la base :
#   ytmgc enrich --dry-run   annonce le coût sans rien envoyer
#   ytmgc enrich             juge par lots (moitié prix)
#   ytmgc lookup "Artiste" "Titre"   juge un seul titre, tout de suite
enabled = true
model = "claude-opus-5"
# Verdicts déjà rendus. Fait autorité : un titre qui y figure n'est jamais
# redemandé, et sa ligne l'emporte sur Discogs comme sur Last.fm. Le fichier
# est fait pour être relu et corrigé à la main.
verdicts_file = "data/verdicts.txt"
# Lot en cours, le temps qu'il aboutisse. Permet d'éteindre l'ordinateur sans
# perdre un traitement déjà payé (`ytmgc enrich --resume`).
pending_file = "data/verdicts.batch.json"
# Titres par requête. Trop peu multiplie le préambule, trop laisse le modèle
# expédier la fin de la liste.
batch_size = 25
max_tokens = 8000
# Confiance en deçà de laquelle le verdict n'écrase pas les métadonnées : le
# modèle a dit qu'il ne connaissait pas le morceau, on le croit.
min_confidence = 0.35

[matching]
# Score minimal (0-1) pour accepter un appariement Discogs automatiquement.
min_score = 0.72
# En dessous de ce score, le titre part en revue manuelle plutôt qu'en playlist.
review_score = 0.55
# Nombre de candidats Discogs examinés par titre.
max_candidates = 10

[taxonomy]
# "all"     : le titre est ajouté à chaque playlist de style correspondante.
#             Une release "Deep House, Tech House" apparaît donc dans les deux :
#             c'est la vue la plus fidèle à ce que décrit Discogs.
# "primary" : un seul style par titre (le plus fréquent dans la bibliothèque),
#             pour une cartographie sans doublon.
multi_style = "all"
# Nombre max de playlists de style par titre quand multi_style = "all".
max_styles_per_track = 2
# Un style n'obtient sa playlist qu'à partir de ce nombre de titres.
# Seuil volontairement bas : l'objectif est de nommer précisément ce qu'on
# écoute. Le monter regroupe davantage et donne moins de playlists.
min_tracks_per_style = 4
# Un genre n'obtient sa playlist qu'à partir de ce nombre de titres.
min_tracks_per_genre = 3
# Playlist fourre-tout pour les titres sous les seuils.
fallback_playlist = "Divers — genres isolés"
# Gabarits de nommage (voir docs/ARCHITECTURE.md).
style_name_template = "{genre} — {style}"
genre_name_template = "{genre} — Autres styles"

[sync]
# Symbole inscrit en fin de description des playlists gérées par l'outil.
# Toute playlist sans ce marqueur est ignorée : les playlists manuelles de
# l'utilisateur ne sont jamais modifiées. Choisis un signe que tu n'emploies
# pas toi-même dans tes descriptions.
marker = "✱"
# Retirer des playlists gérées les titres qui n'y appartiennent plus.
prune = true
# Nombre max de titres envoyés par appel d'API.
batch_size = 50

[web]
# Interface d'écoute. "127.0.0.1" = cette machine uniquement.
# Mettre "0.0.0.0" pour rendre l'interface joignable depuis le réseau local ou
# depuis un port transféré (Codespaces) — un jeton d'accès est alors exigé.
host = "127.0.0.1"
port = 8765
# Exiger un jeton dès que l'écoute dépasse la boucle locale. À ne désactiver
# que si l'accès est déjà protégé par ailleurs.
require_token = true
# Le jeton lui-même n'est jamais lu ici : il vient de YTMGC_ACCESS_TOKEN, ou
# est engendré au démarrage et affiché dans l'URL à ouvrir.
